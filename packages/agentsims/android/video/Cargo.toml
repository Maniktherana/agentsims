[package]
name = "agentsims-android-video"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
	"codec",
	"format",
	"software-scaling",
] }
memmap2 = "0.9.11"
napi = { version = "3.12.1", default-features = false, features = ["napi6"] }
napi-derive = "3.6.3"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
