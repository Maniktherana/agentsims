name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version, such as 1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/agentsims
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:ci

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      AGENTSIMS_RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: packages/agentsims
    steps:
      - uses: actions/checkout@v4
      - name: Validate the version
        shell: bash
        run: |
          if [[ ! "$AGENTSIMS_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact stable version such as 1.2.3" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Select the native compiler
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
      - name: Install and smoke-test the packed packages
        run: bun run verify:package
      - name: Archive npm packages
        run: tar -czf "$RUNNER_TEMP/${{ matrix.target }}.tar.gz" -C dist/npm .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}.tar.gz
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Extract packages
        run: |
          mkdir -p packages/linux-x64 packages/darwin-arm64 packages/darwin-x64
          for target in linux-x64 darwin-arm64 darwin-x64; do
            tar -xzf "artifacts/$target/$target.tar.gz" -C "packages/$target"
          done
      - name: Validate all packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for target in linux-x64 darwin-arm64 darwin-x64; do
            package="packages/$target/agentsims-runtime-$target"
            test "$(node -p "require('./$package/package.json').version")" = "$VERSION"
            npm pack --dry-run "./$package"
          done
          test "$(node -p "require('./packages/linux-x64/agentsims/package.json').version")" = "$VERSION"
          npm pack --dry-run ./packages/linux-x64/agentsims
      - name: Publish runtime packages
        run: |
          for target in linux-x64 darwin-arm64 darwin-x64; do
            npm publish "./packages/$target/agentsims-runtime-$target" --provenance --access public
          done
      - name: Publish the main package last
        run: npm publish ./packages/linux-x64/agentsims --provenance --access public
