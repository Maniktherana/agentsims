name: Publish
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, such as 0.1.0"
        required: true
        type: string
      release_mode:
        description: "build-only keeps the files as a workflow artifact. draft and public create a GitHub release."
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - draft
          - public
      publish_npm:
        description: "Publish the React Native library to npm"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
env:
  AGENTSIMS_RELEASE_VERSION: "${{ inputs.version }}"
jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/agentsims
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        env:
          RELEASE_MODE: "${{ inputs.release_mode }}"
        run: |
          set -euo pipefail
          if [[ ! "$AGENTSIMS_RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a version such as 0.1.0." >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" != build-only ]] && git ls-remote --exit-code --tags origin "refs/tags/v$AGENTSIMS_RELEASE_VERSION" >/dev/null; then
            echo "The tag v$AGENTSIMS_RELEASE_VERSION exists. Choose an unused version." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run --cwd ../agentsims-react-native build
      - run: bun run --cwd ../agentsims-react-native typecheck
      - run: bun run --cwd ../agentsims-react-native lint
      - run: bun run --cwd ../agentsims-react-native test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:ci
      - run: bun run --cwd ../chatgpt build
      - uses: actions/upload-artifact@v4
        with:
          name: library
          path: packages/agentsims-react-native/dist/npm/agentsims/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: packages/chatgpt/dist/agentsims-chatgpt.tar.gz
          if-no-files-found: error
          compression-level: 0
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-2025
    runs-on: "${{ matrix.runner }}"
    env:
      TARGET: "${{ matrix.target }}"
    defaults:
      run:
        shell: bash
        working-directory: packages/agentsims
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Select the native compiler
        if: "runner.os == 'macOS'"
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: bun install --frozen-lockfile
        working-directory: .
      # build.ts verifies the macOS helper architectures and ad hoc signatures.
      - run: bun run build
      - name: Smoke-test the archive
        env:
          AGENTSIMS_HOME_DIR: "${{ runner.temp }}/agentsims-home"
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "dist/releases/agentsims-$TARGET.tar.gz" -C smoke
          agentsims=smoke/dist/agentsims
          [[ "$TARGET" != windows-x64 ]] || agentsims+=.exe
          test "$("$agentsims" --version | tr -d '\r')" = "$AGENTSIMS_RELEASE_VERSION"
          url=$("$agentsims" start --detach --json --host 127.0.0.1 --port 0 | jq -r .url | tr -d '\r')
          curl -fsS "$url/status" >/dev/null
          curl -fsS "$url/" | grep -q '<script'
          "$agentsims" stop
      - uses: actions/upload-artifact@v4
        with:
          name: "runtime-${{ matrix.target }}"
          path: "packages/agentsims/dist/releases/agentsims-${{ matrix.target }}.tar.gz"
          if-no-files-found: error
          compression-level: 0
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: release
      - name: Write the release files
        run: |
          set -euo pipefail
          bun packages/agentsims/scripts/release.ts "$AGENTSIMS_RELEASE_VERSION" release
          bash -n release/install.sh
          ruby -c release/agentsims.rb
          (cd release && sha256sum -c SHA256SUMS)
      - if: "inputs.release_mode == 'build-only'"
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          compression-level: 0
      - name: Create the GitHub release
        if: "inputs.release_mode != 'build-only'"
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_MODE: "${{ inputs.release_mode }}"
        run: |
          set -euo pipefail
          args=(release create "v$AGENTSIMS_RELEASE_VERSION" release/*
            --target "$GITHUB_SHA" --title "Agentsims $AGENTSIMS_RELEASE_VERSION" --generate-notes)
          [[ "$RELEASE_MODE" != draft ]] || args+=(--draft)
          gh "${args[@]}"
  # The HOMEBREW_TAP_DEPLOY_KEY secret holds a write deploy key for Maniktherana/homebrew-tap.
  homebrew:
    if: "inputs.release_mode == 'public'"
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Maniktherana/homebrew-tap
          ssh-key: "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}"
      - name: Publish the formula
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          mkdir -p Formula
          gh release download "v$AGENTSIMS_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern agentsims.rb --dir Formula --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentsims.rb
          git commit -m "agentsims $AGENTSIMS_RELEASE_VERSION"
          git push
  # Homebrew treats a formula without a bottle as a source build. A source build
  # stops when the Command Line Tools are older than the macOS version. A
  # bottle installs without that check. Bottles built on macOS 15 also install
  # on newer macOS versions.
  bottle:
    needs: homebrew
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: "${{ matrix.runner }}"
    permissions:
      contents: write
    steps:
      - name: Build and upload the bottle
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          brew install --build-bottle maniktherana/tap/agentsims
          # A new version needs no bottle rebuild number. Keep the file names predictable.
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$AGENTSIMS_RELEASE_VERSION" \
            maniktherana/tap/agentsims
          # brew bottle writes "name--version" files. The download URL uses "name-version".
          for file in agentsims--*.tar.gz; do mv "$file" "${file/--/-}"; done
          gh release upload "v$AGENTSIMS_RELEASE_VERSION" agentsims-*.bottle*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: "bottle-${{ matrix.runner }}"
          path: "agentsims--*.json"
          if-no-files-found: error
  bottle-formula:
    needs: bottle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Maniktherana/homebrew-tap
          ssh-key: "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: bottle-*
          path: "${{ runner.temp }}/bottles"
          merge-multiple: true
      - name: Add the bottles to the formula
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP"/bottles/*.json <<'EOF'
          import json, re, sys
          lines, root_url = [], None
          for path in sys.argv[1:]:
              for formula in json.load(open(path)).values():
                  bottle = formula["bottle"]
                  root_url = bottle["root_url"]
                  cellar = bottle["cellar"]
                  cellar = f'"{cellar}"' if cellar.startswith("/") else f":{cellar}"
                  for tag, value in bottle["tags"].items():
                      lines.append(f'    sha256 cellar: {cellar}, {tag}: "{value["sha256"]}"')
          block = "\n".join(["  bottle do", f'    root_url "{root_url}"', *sorted(lines), "  end", ""])
          path = "Formula/agentsims.rb"
          text = re.sub(r"\n  bottle do\n.*?\n  end\n\n", "\n", open(path).read(), flags=re.S)
          text = text.replace('  license "Apache-2.0"\n', '  license "Apache-2.0"\n\n' + block, 1)
          open(path, "w").write(text)
          EOF
          ruby -c Formula/agentsims.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentsims.rb
          git commit -m "agentsims $AGENTSIMS_RELEASE_VERSION bottles"
          git push
  verify-homebrew:
    needs: bottle-formula
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: "${{ matrix.runner }}"
    steps:
      - name: Install the published bottle on a fresh Mac
        run: |
          set -euo pipefail
          brew install maniktherana/tap/agentsims 2>&1 | tee install.log
          grep -q "Pouring agentsims" install.log
          brew test maniktherana/tap/agentsims
          test "$(agentsims --version)" = "$AGENTSIMS_RELEASE_VERSION"
  # Configure the npm trusted publisher for publish.yml and the npm environment.
  # OIDC publication requires npm 11.5.1 or newer. No registry token is stored here.
  npm:
    if: "inputs.publish_npm"
    needs: release
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: library
          path: library
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Check the library version
        run: test "$(node -p "require('./library/package.json').version")" = "$AGENTSIMS_RELEASE_VERSION"
      - run: npm publish ./library --ignore-scripts --provenance --access public
