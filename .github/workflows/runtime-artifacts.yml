name: Runtime artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release or prerelease version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      AGENTSIMS_RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: packages/agentsims
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Select the native compiler
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Install macOS FFmpeg development and runtime libraries
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@8 pkg-config
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@8)" >> "$GITHUB_ENV"
          "$(brew --prefix ffmpeg@8)/bin/ffmpeg" -version
      - name: Install Linux FFmpeg development and runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y 'ffmpeg=7:4.4.*' libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libclang-dev pkg-config
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          ln -s /usr/include/x86_64-linux-gnu "$RUNNER_TEMP/ffmpeg/include"
          ln -s /usr/lib/x86_64-linux-gnu "$RUNNER_TEMP/ffmpeg/lib"
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          ffmpeg -version
      - run: cargo fetch --locked --manifest-path android/video/Cargo.toml
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun test
      - name: Archive npm packages
        run: tar -czf "$RUNNER_TEMP/${{ matrix.target }}.tar.gz" -C dist/npm .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}.tar.gz
          retention-days: 14
